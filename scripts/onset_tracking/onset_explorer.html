<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onset tracking explorer</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root { --bg:#14151a; --panel:#1d1f27; --fg:#e6e8ee; --muted:#9097a8; --accent:#4cc9f0; --bad:#ff5a4d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { background:var(--panel); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 28px; align-items:center; }
  .slider { display:flex; flex-direction:column; min-width:210px; }
  .slider label { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .slider output { color:var(--fg); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  #file { display:flex; align-items:center; gap:10px; }
  #drop { border:1px dashed var(--muted); border-radius:6px; padding:6px 12px; color:var(--muted); }
  body.dragging #drop { border-color:var(--accent); color:var(--accent); }
  #status { color:var(--muted); font-size:12px; padding:4px 16px; background:var(--panel); border-top:1px solid #2a2d38;
            font-variant-numeric:tabular-nums; }
  #status b { color:var(--fg); font-weight:600; }
  #error { color:var(--bad); padding:4px 16px; }
  #plot { flex:1; min-height:0; }
</style>
</head>
<body>
<header>
  <div id="file">
    <input type="file" id="picker" accept=".npz">
    <span id="drop">or drop a salience .npz here</span>
  </div>
  <div class="slider"><label>f0 peak threshold <output id="o-threshold"></output></label>
    <input type="range" id="threshold" min="0.05" max="0.8" step="0.01" value="0.17"></div>
  <div class="slider"><label>allowed gap before new track <output id="o-gap"></output></label>
    <input type="range" id="gap" min="0" max="43" step="1" value="5"></div>
  <div class="slider"><label>mask after track start <output id="o-mask"></output></label>
    <input type="range" id="mask" min="0" max="86" step="1" value="9"></div>
  <div class="slider"><label>max association distance <output id="o-dist"></output></label>
    <input type="range" id="dist" min="5" max="300" step="5" value="100"></div>
  <div class="slider"><label>min hits to keep a track <output id="o-hits"></output></label>
    <input type="range" id="hits" min="1" max="30" step="1" value="5"></div>
</header>
<div id="error"></div>
<div id="status">Load a file.</div>
<div id="plot"></div>

<script>
// Core of the onset-tracking investigation: .npz loading, f0 peak picking and 1D SORT tracking.
// Plain script (no imports) so it can be inlined into the standalone HTML page and also be
// require()d from node for testing.
//
// f0 detection is a port of worker/notes.js (extractFramePeaks): strict local maximum along
// frequency, salience >= threshold, parabolic sub-bin refinement. Keep the two in sync.

const OT = (function () {
    'use strict';

    // --- constants shared with ../../constants.js -----------------------------------------------
    const F_MIN = 27.5;
    const A0_BIN = 0;
    const BINS_PER_OCTAVE = 36;
    const REFERENCE_A4 = 440;
    const FRAME_DURATION = 256 / 22050;

    // --- SORT tuning that is NOT exposed as a slider ----------------------------------------------
    // Units: cents, frames. State is [f0 (cents), velocity (cents/frame)], constant velocity model.
    const KALMAN = {
        sigmaAccel: 2,          // cents/frame^2, std of the random acceleration (process noise)
        measurementStd: 25,     // cents, std of a measured f0 around the true pitch
        initialVelocityStd: 15, // cents/frame, uncertainty of velocity of a fresh track
    };

    // --- .npz / .npy parsing ----------------------------------------------------------------------

    async function inflateRaw(bytes) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    /** @returns {Promise<Object<string,Uint8Array>>} file name -> bytes */
    async function readZip(buffer) {
        const bytes = new Uint8Array(buffer);
        const view = new DataView(buffer);
        let eocd = -1;
        for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
            if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
        }
        if (eocd < 0) { throw new Error('Not a zip/npz file (no end-of-central-directory record).'); }
        const count = view.getUint16(eocd + 10, true);
        let p = view.getUint32(eocd + 16, true);
        const files = {};
        const decoder = new TextDecoder();
        for (let n = 0; n < count; n++) {
            if (view.getUint32(p, true) !== 0x02014b50) { throw new Error('Corrupt zip directory.'); }
            const method = view.getUint16(p + 10, true);
            const compSize = view.getUint32(p + 20, true);
            const nameLen = view.getUint16(p + 28, true);
            const extraLen = view.getUint16(p + 30, true);
            const commentLen = view.getUint16(p + 32, true);
            const localOffset = view.getUint32(p + 42, true);
            const name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLen));
            const localNameLen = view.getUint16(localOffset + 26, true);
            const localExtraLen = view.getUint16(localOffset + 28, true);
            const start = localOffset + 30 + localNameLen + localExtraLen;
            const raw = bytes.subarray(start, start + compSize);
            if (method === 0) { files[name] = raw; }
            else if (method === 8) { files[name] = await inflateRaw(raw); }
            else { throw new Error(`Unsupported zip compression method ${method} for ${name}.`); }
            p += 46 + nameLen + extraLen + commentLen;
        }
        return files;
    }

    function half(h) {
        const sign = h >> 15 ? -1 : 1;
        const exponent = (h >> 10) & 31;
        const fraction = h & 1023;
        if (exponent === 0) { return sign * 5.960464477539063e-8 * fraction; }
        if (exponent === 31) { return fraction ? NaN : sign * Infinity; }
        return sign * Math.pow(2, exponent - 25) * (1024 + fraction);
    }

    /** @returns {{shape:number[], fortran:boolean, data:Float32Array|null, text:string|null}} */
    function parseNpy(bytes) {
        if (bytes[0] !== 0x93 || String.fromCharCode(...bytes.subarray(1, 6)) !== 'NUMPY') {
            throw new Error('Not an .npy array.');
        }
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const major = bytes[6];
        const headerLength = major === 1 ? view.getUint16(8, true) : view.getUint32(8, true);
        const dataStart = (major === 1 ? 10 : 12) + headerLength;
        const header = new TextDecoder().decode(bytes.subarray(dataStart - headerLength, dataStart));
        const descr = /'descr':\s*'([^']+)'/.exec(header)[1];
        const fortran = /'fortran_order':\s*True/.test(header);
        const shape = (/'shape':\s*\(([^)]*)\)/.exec(header)[1])
            .split(',').map((s) => s.trim()).filter(Boolean).map(Number);
        const count = shape.reduce((a, b) => a * b, 1);
        const out = new Float32Array(count);
        const read = {
            '<f2': (i) => half(view.getUint16(dataStart + 2 * i, true)),
            '<f4': (i) => view.getFloat32(dataStart + 4 * i, true),
            '<f8': (i) => view.getFloat64(dataStart + 8 * i, true),
        }[descr];
        if (!read) { return { shape, fortran, data: null, text: descr }; }   // strings etc.: ignored
        for (let i = 0; i < count; i++) { out[i] = read(i); }
        return { shape, fortran, data: out, text: null };
    }

    /**
     * Load a salience map from an .npz (as written by np.savez / np.savez_compressed).
     * Required: 'salience' (2D). Optional: 'freq_grid', 'time_grid'.
     * @returns {Promise<{salience:Float32Array, nBins:number, nFrames:number,
     *                    freqs:Float64Array, times:Float64Array}>}
     *   salience is indexed [bin + nBins * frame]
     */
    async function loadNpz(buffer) {
        const files = await readZip(buffer);
        const arrays = {};
        for (const [name, bytes] of Object.entries(files)) {
            if (name.endsWith('.npy')) { arrays[name.slice(0, -4)] = parseNpy(bytes); }
        }
        const sal = arrays.salience;
        if (!sal || !sal.data || sal.shape.length !== 2) {
            throw new Error(`No 2D 'salience' array in file (found: ${Object.keys(arrays).join(', ')}).`);
        }
        const gridLength = arrays.freq_grid?.data ? arrays.freq_grid.data.length : Math.min(...sal.shape);
        const binsFirst = sal.shape[0] === gridLength;
        if (!binsFirst && sal.shape[1] !== gridLength) {
            throw new Error(`salience shape ${sal.shape} does not match freq_grid length ${gridLength}.`);
        }
        const nBins = gridLength;
        const nFrames = binsFirst ? sal.shape[1] : sal.shape[0];
        const salience = new Float32Array(nBins * nFrames);
        for (let b = 0; b < nBins; b++) {
            for (let f = 0; f < nFrames; f++) {
                // Index into the stored array, which is shape[0] x shape[1] in C or Fortran order.
                const [i, j] = binsFirst ? [b, f] : [f, b];
                const stored = sal.fortran ? i + sal.shape[0] * j : i * sal.shape[1] + j;
                salience[b + nBins * f] = sal.data[stored];
            }
        }
        const freqs = new Float64Array(nBins);
        for (let b = 0; b < nBins; b++) {
            freqs[b] = arrays.freq_grid?.data ? arrays.freq_grid.data[b] : binToFrequency(b);
        }
        const times = new Float64Array(nFrames);
        for (let f = 0; f < nFrames; f++) {
            times[f] = arrays.time_grid?.data && arrays.time_grid.data.length === nFrames
                ? arrays.time_grid.data[f] : f * FRAME_DURATION;
        }
        return { salience, nBins, nFrames, freqs, times };
    }

    // --- f0 detection (port of worker/notes.js) ---------------------------------------------------

    function binToFrequency(bin) {
        return F_MIN * Math.pow(2, (bin - A0_BIN) / BINS_PER_OCTAVE);
    }

    /** Absolute pitch in cents on the MIDI scale (6900 = A4 at 440 Hz). */
    function frequencyToCents(frequency) {
        return 100 * (69 + 12 * Math.log2(frequency / REFERENCE_A4));
    }

    function refineOffset(below, at, above) {
        const denominator = below - 2 * at + above;
        if (denominator === 0) { return 0; }
        const offset = (0.5 * (below - above)) / denominator;
        if (!Number.isFinite(offset)) { return 0; }
        return Math.max(-0.5, Math.min(0.5, offset));
    }

    /**
     * @returns {{frame:Int32Array, cents:Float64Array, salience:Float32Array,
     *            frequency:Float64Array, count:number}} ordered by frame, then ascending bin
     */
    function detectF0(map, threshold) {
        const { salience, nBins, nFrames } = map;
        const frame = [], cents = [], sal = [], freq = [];
        for (let f = 0; f < nFrames; f++) {
            const offset = nBins * f;
            for (let bin = 1; bin < nBins - 1; bin++) {
                const value = salience[offset + bin];
                if (value < threshold) { continue; }
                const below = salience[offset + bin - 1];
                const above = salience[offset + bin + 1];
                if (!(value > below && value > above)) { continue; }
                const frequency = binToFrequency(bin + refineOffset(below, value, above));
                frame.push(f);
                cents.push(frequencyToCents(frequency));
                sal.push(value);
                freq.push(frequency);
            }
        }
        return {
            frame: Int32Array.from(frame), cents: Float64Array.from(cents),
            salience: Float32Array.from(sal), frequency: Float64Array.from(freq), count: frame.length,
        };
    }

    // --- Hungarian algorithm (min-cost assignment, rectangular) -----------------------------------

    /** @returns {number[]} for each row the assigned column, or -1 */
    function hungarian(cost, rows, cols) {
        if (rows === 0 || cols === 0) { return new Array(rows).fill(-1); }
        if (rows > cols) {
            const transposed = Array.from({ length: cols }, (_, j) =>
                Array.from({ length: rows }, (_, i) => cost[i][j]));
            const colToRow = hungarian(transposed, cols, rows);
            const rowToCol = new Array(rows).fill(-1);
            colToRow.forEach((row, col) => { if (row >= 0) { rowToCol[row] = col; } });
            return rowToCol;
        }
        const INF = Infinity;
        const u = new Float64Array(rows + 1), v = new Float64Array(cols + 1);
        const p = new Int32Array(cols + 1), way = new Int32Array(cols + 1);
        for (let i = 1; i <= rows; i++) {
            p[0] = i;
            let j0 = 0;
            const minv = new Float64Array(cols + 1).fill(INF);
            const used = new Uint8Array(cols + 1);
            do {
                used[j0] = 1;
                const i0 = p[j0];
                let delta = INF, j1 = 0;
                for (let j = 1; j <= cols; j++) {
                    if (used[j]) { continue; }
                    const current = cost[i0 - 1][j - 1] - u[i0] - v[j];
                    if (current < minv[j]) { minv[j] = current; way[j] = j0; }
                    if (minv[j] < delta) { delta = minv[j]; j1 = j; }
                }
                for (let j = 0; j <= cols; j++) {
                    if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else { minv[j] -= delta; }
                }
                j0 = j1;
            } while (p[j0] !== 0);
            do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
        }
        const rowToCol = new Array(rows).fill(-1);
        for (let j = 1; j <= cols; j++) { if (p[j]) { rowToCol[p[j] - 1] = j - 1; } }
        return rowToCol;
    }

    // --- 1D SORT ----------------------------------------------------------------------------------

    /**
     * Simple Online and Realtime Tracking on a single (pitch) axis.
     *
     * Per frame: every live track predicts its pitch (constant velocity Kalman), detections are
     * assigned to tracks with the Hungarian algorithm on |detection - prediction| in cents (pairs
     * further apart than maxDistance are not allowed), assigned tracks are updated, unassigned
     * detections start new tracks, tracks that went unmatched for more than maxGapFrames frames end.
     * Tracks with fewer than minHits detections are dropped afterwards.
     *
     * @returns {{tracks:Array<{id:number, frames:number[], det:number[], cents:number[],
     *            estimate:number[]}>, detTrack:Int32Array}}
     *   estimate = filtered Kalman pitch (cents) at each detection of the track
     */
    function sortTrack(dets, nFrames, { maxDistance, maxGapFrames, minHits }) {
        const R = KALMAN.measurementStd ** 2;
        const Q = KALMAN.sigmaAccel ** 2;
        const BIG = 1e6;
        const live = [];
        const finished = [];
        let cursor = 0;

        for (let f = 0; f < nFrames; f++) {
            const first = cursor;
            while (cursor < dets.count && dets.frame[cursor] === f) { cursor++; }
            const nDet = cursor - first;

            // predict
            for (const t of live) {
                t.x += t.v;
                const { p00, p01, p11 } = t;
                t.p00 = p00 + 2 * p01 + p11 + Q * 0.25;
                t.p01 = p01 + p11 + Q * 0.5;
                t.p11 = p11 + Q;
            }

            const cost = live.map((t) => Array.from({ length: nDet }, (_, d) => {
                const distance = Math.abs(dets.cents[first + d] - t.x);
                return distance <= maxDistance ? distance : BIG;
            }));
            const assignment = hungarian(cost, live.length, nDet);
            const taken = new Uint8Array(nDet);

            live.forEach((t, i) => {
                const d = assignment[i];
                if (d >= 0 && cost[i][d] < BIG) {
                    taken[d] = 1;
                    const z = dets.cents[first + d];
                    const s = t.p00 + R;
                    const k0 = t.p00 / s, k1 = t.p01 / s;
                    const innovation = z - t.x;
                    t.x += k0 * innovation;
                    t.v += k1 * innovation;
                    const { p00, p01, p11 } = t;
                    t.p00 = (1 - k0) * p00;
                    t.p01 = (1 - k0) * p01;
                    t.p11 = p11 - k1 * p01;
                    t.misses = 0;
                    t.frames.push(f); t.det.push(first + d); t.cents.push(z); t.estimate.push(t.x);
                } else {
                    t.misses++;
                }
            });

            for (let d = 0; d < nDet; d++) {
                if (taken[d]) { continue; }
                const z = dets.cents[first + d];
                live.push({
                    x: z, v: 0, p00: R, p01: 0, p11: KALMAN.initialVelocityStd ** 2, misses: 0,
                    frames: [f], det: [first + d], cents: [z], estimate: [z],
                });
            }

            for (let i = live.length - 1; i >= 0; i--) {
                if (live[i].misses > maxGapFrames) { finished.push(live[i]); live.splice(i, 1); }
            }
        }
        finished.push(...live);

        const detTrack = new Int32Array(dets.count).fill(-1);
        const tracks = finished
            .filter((t) => t.det.length >= minHits)
            .sort((a, b) => a.frames[0] - b.frames[0])
            .map((t, id) => {
                t.det.forEach((d) => { detTrack[d] = id; });
                return { id, frames: t.frames, det: t.det, cents: t.cents, estimate: t.estimate };
            });
        return { tracks, detTrack };
    }

    // --- onset masking and spread -----------------------------------------------------------------

    function stats(values) {
        const n = values.length;
        if (n === 0) { return { n: 0, mean: NaN, std: NaN }; }
        let sum = 0;
        for (const x of values) { sum += x; }
        const mean = sum / n;
        let squares = 0;
        for (const x of values) { squares += (x - mean) ** 2; }
        return { n, mean, std: n > 1 ? Math.sqrt(squares / (n - 1)) : NaN };
    }

    /**
     * Mask the detections within maskFrames of each track's first frame and compute the spread of
     * each track with and without them. (Mask is relative to the track's first detection only; a
     * track that resumes after a gap is not masked again.)
     * Adds to each track: masked (boolean per detection), all {n,mean,std}, kept {n,mean,std}.
     */
    function maskAndSpread(tracks, maskFrames) {
        for (const t of tracks) {
            const start = t.frames[0];
            t.masked = t.frames.map((f) => f - start < maskFrames);
            t.all = stats(t.cents);
            t.kept = stats(t.cents.filter((_, i) => !t.masked[i]));
        }
    }

    return {
        KALMAN, FRAME_DURATION, loadNpz, parseNpy, readZip, detectF0, sortTrack, maskAndSpread,
        binToFrequency, frequencyToCents, hungarian,
    };
})();

if (typeof module !== 'undefined') { module.exports = OT; }

</script>

const PALETTE = ['#4cc9f0', '#f9c74f', '#90be6d', '#f8961e', '#b388eb', '#43aa8b',
                 '#ffd6a5', '#00f5d4', '#a0c4ff', '#caffbf', '#fdffb6', '#ff9f1c'];
const MASKED_COLOR = '#ff3b30';
const MAX_BAND_TRACKS = 500;                   // bands are layout shapes; keep the page responsive
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

const $ = (id) => document.getElementById(id);
let map = null, fileName = '', heatmap = null, plotReady = false, pending = false;

const noteName = (midi) => NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);

function controls() {
    return {
        threshold: +$('threshold').value,
        gapFrames: +$('gap').value,
        maskFrames: +$('mask').value,
        maxDistance: +$('dist').value,
        minHits: +$('hits').value,
    };
}

function updateReadouts(c) {
    $('o-threshold').textContent = c.threshold.toFixed(2);
    $('o-gap').textContent = `${c.gapFrames} frames`;
    $('o-mask').textContent = `${c.maskFrames} frames`;
    $('o-dist').textContent = `${c.maxDistance} cents`;
    $('o-hits').textContent = `${c.minHits} frames`;
}

function fmt(x) { return Number.isFinite(x) ? x.toFixed(1) : '–'; }

function compute(c) {
    const dets = OT.detectF0(map, c.threshold);
    const { tracks, detTrack } = OT.sortTrack(dets, map.nFrames, {
        maxDistance: c.maxDistance,
        maxGapFrames: c.gapFrames,
        minHits: c.minHits,
    });
    OT.maskAndSpread(tracks, c.maskFrames);
    return { dets, tracks, detTrack };
}

function tickLayout(range) {
    // Every semitone when zoomed in; only the C's when zoomed out, so labels never overlap.
    const [lo, hi] = range;
    const every = hi - lo <= 30;
    const vals = [], text = [];
    for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
        if (every || m % 12 === 0) { vals.push(m); text.push(noteName(m)); }
    }
    return { tickvals: vals, ticktext: text };
}

function render() {
    pending = false;
    if (!map) { return; }
    const c = controls();
    updateReadouts(c);
    const { dets, tracks, detTrack } = compute(c);
    const time = (f) => map.times[f];
    const midi = (cents) => cents / 100;

    // Detections: unassigned, masked, and unmasked-in-track.
    const un = { x: [], y: [], text: [] }, mk = { x: [], y: [], text: [] };
    const kp = { x: [], y: [], text: [], color: [] };
    const hover = (i, label) =>
        `${label}<br>t = ${time(dets.frame[i]).toFixed(3)} s<br>${dets.frequency[i].toFixed(2)} Hz` +
        `<br>${noteName(Math.round(dets.cents[i] / 100))} ${(dets.cents[i] - 100 * Math.round(dets.cents[i] / 100)).toFixed(1)} c` +
        `<br>salience ${dets.salience[i].toFixed(3)}`;
    const maskedSet = new Uint8Array(dets.count);
    for (const t of tracks) { t.det.forEach((d, i) => { if (t.masked[i]) { maskedSet[d] = 1; } }); }
    for (let i = 0; i < dets.count; i++) {
        const target = detTrack[i] < 0 ? un : maskedSet[i] ? mk : kp;
        target.x.push(time(dets.frame[i]));
        target.y.push(midi(dets.cents[i]));
        target.text.push(hover(i, detTrack[i] < 0 ? 'unassigned' : `track ${detTrack[i]}` + (maskedSet[i] ? ' (masked)' : '')));
        if (target === kp) { target.color.push(PALETTE[detTrack[i] % PALETTE.length]); }
    }

    const traces = [heatmap,
        { type: 'scattergl', mode: 'markers', name: 'unassigned f0', x: un.x, y: un.y, text: un.text, hoverinfo: 'text',
          marker: { size: 4, color: 'rgba(0,0,0,0)', line: { color: '#cfd3dc', width: 1 } } },
    ];
    for (const t of tracks) {
        traces.push({
            type: 'scattergl', mode: 'lines', x: t.frames.map(time), y: t.estimate.map(midi),
            line: { color: PALETTE[t.id % PALETTE.length], width: 1.5 }, hoverinfo: 'skip', showlegend: false,
        });
    }
    traces.push(
        { type: 'scattergl', mode: 'markers', name: 'f0 in track (colour = track)', x: kp.x, y: kp.y, text: kp.text, hoverinfo: 'text',
          marker: { size: 5, color: kp.color.length ? kp.color : PALETTE[0], line: { color: '#000', width: 0.5 } } },
        { type: 'scattergl', mode: 'markers', name: 'f0 masked (onset)', x: mk.x, y: mk.y, text: mk.text, hoverinfo: 'text',
          marker: { size: 6, symbol: 'x', color: MASKED_COLOR, line: { color: MASKED_COLOR, width: 1.5 } } },
        { type: 'scatter', mode: 'lines', name: 'SORT track (Kalman estimate)', x: [null], y: [null],
          line: { color: '#fff', width: 1.5 } },
    );

    // Spread bands: dashed outline = all f0s of the track, filled solid = unmasked f0s only.
    const shapes = [];
    for (const t of tracks.slice(0, MAX_BAND_TRACKS)) {
        const color = PALETTE[t.id % PALETTE.length];
        const band = (s, x0, x1, extra) => Number.isFinite(s.std) && shapes.push({
            type: 'rect', xref: 'x', yref: 'y', x0: time(x0), x1: time(x1),
            y0: midi(s.mean - s.std), y1: midi(s.mean + s.std), layer: 'above', ...extra,
        });
        band(t.all, t.frames[0], t.frames[t.frames.length - 1],
            { line: { color, width: 1, dash: 'dot' }, fillcolor: 'rgba(0,0,0,0)' });
        const keptFrames = t.frames.filter((_, i) => !t.masked[i]);
        if (keptFrames.length) {
            band(t.kept, keptFrames[0], keptFrames[keptFrames.length - 1],
                { line: { color, width: 1.5 }, fillcolor: color + '40' });
        }
    }

    const layout = {
        paper_bgcolor: '#14151a', plot_bgcolor: '#0b0b12', font: { color: '#e6e8ee' },
        margin: { l: 56, r: 16, t: 8, b: 40 }, uirevision: fileName,
        xaxis: { title: 'time (s)', gridcolor: '#2a2d38', zeroline: false },
        yaxis: { title: 'pitch', gridcolor: '#2a2d38', zeroline: false, ...tickLayout(currentYRange()) },
        legend: { orientation: 'h', y: 1.0, yanchor: 'bottom', x: 0 },
        shapes, dragmode: 'zoom',
    };
    Plotly.react('plot', traces, layout, { responsive: true, scrollZoom: true }).then(() => {
        if (!plotReady) {
            plotReady = true;
            $('plot').on('plotly_relayout', (e) => {
                const lo = e['yaxis.range[0]'], hi = e['yaxis.range[1]'];
                if (lo !== undefined && hi !== undefined) { Plotly.relayout('plot', tickLayout([lo, hi])); }
                else if (e['yaxis.autorange']) { Plotly.relayout('plot', tickLayout(currentYRange())); }
            });
        }
    });

    // Summary.
    let nMasked = 0, nUnassigned = 0;
    for (let i = 0; i < dets.count; i++) { if (detTrack[i] < 0) { nUnassigned++; } else if (maskedSet[i]) { nMasked++; } }
    const weighted = (key) => {
        let num = 0, den = 0;
        for (const t of tracks) { if (Number.isFinite(t[key].std)) { num += t[key].std * t[key].n; den += t[key].n; } }
        return den ? num / den : NaN;
    };
    // Compare like with like: spread over the same tracks, all f0s vs. unmasked f0s.
    $('status').innerHTML =
        `<b>${fileName}</b> &middot; ${map.nFrames} frames, ${map.times[map.nFrames - 1].toFixed(1)} s &middot; ` +
        `<b>${dets.count}</b> f0 detections: ${dets.count - nUnassigned} in <b>${tracks.length}</b> tracks ` +
        `(${nMasked} masked = ${(100 * nMasked / Math.max(1, dets.count - nUnassigned)).toFixed(0)}% of track f0s), ` +
        `${nUnassigned} unassigned &middot; mean track spread (std): all f0s <b>${fmt(weighted('all'))} c</b>, ` +
        `unmasked <b>${fmt(weighted('kept'))} c</b>` +
        (tracks.length > MAX_BAND_TRACKS ? ` &middot; spread bands drawn for first ${MAX_BAND_TRACKS} tracks only` : '');
}

function currentYRange() {
    const el = $('plot');
    return el.layout?.yaxis?.range ?? initialYRange;
}
let initialYRange = [36, 84];

function schedule() { if (!pending) { pending = true; requestAnimationFrame(render); } }

function setMap(m, name) {
    map = m; fileName = name; plotReady = false;
    Plotly.purge('plot');
    const rows = [];
    for (let b = 0; b < m.nBins; b++) {
        const row = new Float32Array(m.nFrames);
        for (let f = 0; f < m.nFrames; f++) { row[f] = m.salience[b + m.nBins * f]; }
        rows.push(row);
    }
    const yMidi = Array.from(m.freqs, (f) => 69 + 12 * Math.log2(f / 440));
    heatmap = {
        type: 'heatmap', x: Array.from(m.times), y: yMidi, z: rows, zmin: 0, zmax: 1, showscale: false,
        colorscale: [[0, '#0b0b12'], [1, '#eceff6']], hoverinfo: 'skip', name: 'salience', showlegend: false,
    };
    // Initial view: the pitch range that actually contains detections at the current threshold.
    const dets = OT.detectF0(m, 0.3);
    if (dets.count) {
        let lo = Infinity, hi = -Infinity;
        for (const c of dets.cents) { lo = Math.min(lo, c); hi = Math.max(hi, c); }
        initialYRange = [lo / 100 - 3, hi / 100 + 3];
    }
    schedule();
    // Force the layout to start at that range (uirevision keeps later zooms).
    setTimeout(() => Plotly.relayout('plot', { 'yaxis.range': initialYRange }), 0);
}

async function loadBuffer(buffer, name) {
    $('error').textContent = '';
    try { setMap(await OT.loadNpz(buffer), name); }
    catch (e) { $('error').textContent = `${name}: ${e.message}`; console.error(e); }
}

async function loadFile(file) { await loadBuffer(await file.arrayBuffer(), file.name); }

$('picker').addEventListener('change', (e) => e.target.files[0] && loadFile(e.target.files[0]));
for (const ev of ['dragenter', 'dragover']) {
    window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
}
for (const ev of ['dragleave', 'drop']) {
    window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove('dragging'); });
}
window.addEventListener('drop', (e) => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));
for (const id of ['threshold', 'gap', 'mask', 'dist', 'hits']) { $(id).addEventListener('input', schedule); }
updateReadouts(controls());

if (EMBEDDED) {
    const bytes = Uint8Array.from(atob(EMBEDDED.base64), (ch) => ch.charCodeAt(0));
    loadBuffer(bytes.buffer, EMBEDDED.name);
}
</script>
</body>
</html>
