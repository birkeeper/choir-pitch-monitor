<!DOCTYPE html>
<html lang='en' data-bs-theme="dark">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Model runner: correctness and throughput</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="robots" content="noindex">
    <style>
        * { font-size: 0.9rem; }
        pre { white-space: pre-wrap; }
        .ok { color: var(--bs-success); }
        .bad { color: var(--bs-danger); }
        .muted { color: var(--bs-secondary-color); }
    </style>
</head>
<body>
<div class="container-xl py-3">
    <h4>Model runner: correctness and throughput</h4>
    <p class="muted">
        Checks <code>worker/model.js</code> against the Keras reference output in
        <code>tests/fixtures/</code>, then measures inference throughput on every available
        backend. Serve this over HTTP (<code>python -m http.server</code>) from the repository
        root, not via <code>file://</code>.
    </p>
    <div class="mb-3">
        <button id="run" class="btn btn-primary btn-sm">Run</button>
        <label class="ms-3">
            frames per chunk
            <input id="frames" type="number" value="256" min="32" max="2048" step="32"
                   class="form-control form-control-sm d-inline-block" style="width: 7rem">
        </label>
        <label class="ms-3">
            repeats
            <input id="repeats" type="number" value="3" min="1" max="20"
                   class="form-control form-control-sm d-inline-block" style="width: 5rem">
        </label>
    </div>
    <pre id="log" class="border rounded p-3"></pre>
</div>

<script type="module">
import * as tf from '../libraries/tfjs/tfjs.js';
import { SalienceModel, selectBackend } from '../worker/model.js';
import { FRAME_RATE } from '../constants.js';

const logElement = document.getElementById('log');
const write = (text, cls) => {
    const line = document.createElement('span');
    if (cls) { line.className = cls; }
    line.textContent = text + '\n';
    logElement.appendChild(line);
};

/**
 * Report how the model was adapted to this GPU. The chunk width and the kernel splitting are both
 * derived from the GPU's reported WEBGL_MAX_TEXTURE_SIZE, so throughput numbers below are only
 * comparable between machines that landed on the same plan.
 */
function describePlan(model) {
    const plan = model.plan;
    write(`device plan: chunk ${plan.chunkFrames} frames`
        + (plan.maxTextureSize ? `, max texture ${plan.maxTextureSize}` : ', unconstrained'));
    const splits = Object.entries(plan.splits);
    if (splits.length) {
        write(`  ${splits.length} layer(s) split to fit: `
            + splits.map(([name, rows]) => `${name} in ${rows}-row groups`).join(', '));
    } else {
        write('  no layers need splitting');
    }
}

async function fetchFloat32(url) {
    const response = await fetch(url);
    if (!response.ok) { throw new Error(`${url}: ${response.status}`); }
    return new Float32Array(await response.arrayBuffer());
}

/**
 * The fixture is stored in Keras order (1, bins, frames, harmonics), which is C-order
 * bin-major -- the same layout SalienceModel.predict() expects. No transposition needed.
 */
async function checkCorrectness(model) {
    const spec = await (await fetch('./fixtures/model-io.json')).json();
    const [mag, dphase, expected] = await Promise.all([
        fetchFloat32(`./fixtures/${spec.inputs.mag}`),
        fetchFloat32(`./fixtures/${spec.inputs.dphase}`),
        fetchFloat32(`./fixtures/${spec.output}`),
    ]);

    if (spec.weights_sha256 !== model.source.weights_sha256) {
        write(`  fixture was generated from different weights than model/ contains`, 'bad');
        write(`    fixture: ${spec.weights_sha256}`);
        write(`    model:   ${model.source.weights_sha256}`);
        return false;
    }

    const actual = await model.predict(mag, dphase, spec.frames);

    let maxError = 0;
    let sumError = 0;
    for (let i = 0; i < expected.length; i++) {
        const error = Math.abs(actual[i] - expected[i]);
        maxError = Math.max(maxError, error);
        sumError += error;
    }
    const meanError = sumError / expected.length;

    // The salience output is a sigmoid in [0, 1]. TF.js convolutions on a GPU accumulate in a
    // different order than TensorFlow on CPU, so exact equality is not expected; anything at 1e-3
    // or below is float32 reassociation noise, not a structural difference.
    const pass = maxError < 1e-3;
    write(`  max abs error  ${maxError.toExponential(3)}`, pass ? 'ok' : 'bad');
    write(`  mean abs error ${meanError.toExponential(3)}`);
    write(`  ${pass ? 'PASS' : 'FAIL'} against Keras over ${spec.output_shape.join('x')}`,
        pass ? 'ok' : 'bad');
    return pass;
}

async function benchmark(model, frames, repeats) {
    const bins = model.bins;
    const harmonics = model.harmonics;
    const size = bins * frames * harmonics;
    const mag = new Float32Array(size);
    const dphase = new Float32Array(size);
    for (let i = 0; i < size; i++) {
        mag[i] = Math.random() * -80;
        dphase[i] = (Math.random() * 2 - 1) * Math.PI;
    }

    // One untimed pass: the first call compiles shaders and allocates textures, which on WebGL can
    // be several seconds and would otherwise dominate the measurement.
    await model.predict(mag, dphase, frames);

    const times = [];
    for (let i = 0; i < repeats; i++) {
        const start = performance.now();
        await model.predict(mag, dphase, frames);
        times.push(performance.now() - start);
    }
    times.sort((a, b) => a - b);
    const median = times[Math.floor(times.length / 2)] / 1000;
    const audioSeconds = frames / FRAME_RATE;
    return { median, audioSeconds, realTimeFactor: audioSeconds / median };
}

document.getElementById('run').addEventListener('click', async () => {
    logElement.textContent = '';
    const frames = Number(document.getElementById('frames').value);
    const repeats = Number(document.getElementById('repeats').value);

    let model;
    try {
        await selectBackend();
        model = await SalienceModel.load('../model/');
    } catch (error) {
        write(`failed to load model: ${error.message}`, 'bad');
        return;
    }
    write(`model: ${model.source.architecture} / ${model.source.weights}`);
    write(`bins ${model.bins}, harmonics ${model.harmonics}, `
        + `default threshold ${model.defaultThreshold}`);
    describePlan(model);
    write('');

    write(`correctness on backend '${tf.getBackend()}':`);
    await checkCorrectness(model);
    write('');

    write(`throughput, ${frames} frames per chunk `
        + `(${(frames / FRAME_RATE).toFixed(2)} s of audio), median of ${repeats}:`);
    for (const backend of ['webgpu', 'webgl', 'cpu']) {
        let available = false;
        try {
            available = await tf.setBackend(backend);
            if (available) { await tf.ready(); }
        } catch (error) {
            write(`  ${backend.padEnd(8)} unavailable (${error.message})`, 'muted');
            continue;
        }
        if (!available) {
            write(`  ${backend.padEnd(8)} unavailable`, 'muted');
            continue;
        }
        if (backend === 'cpu') {
            write(`  ${backend.padEnd(8)} skipped -- pure-JS CPU is orders of magnitude too slow `
                + `for this model to be informative`, 'muted');
            continue;
        }
        try {
            // Weights live on the previous backend's device, so reload for a fair measurement.
            model.dispose();
            model = await SalienceModel.load('../model/');
            const { median, realTimeFactor } = await benchmark(model, frames, repeats);
            write(`  ${backend.padEnd(8)} ${median.toFixed(2)} s per chunk  ->  `
                + `${realTimeFactor.toFixed(2)}x real-time`,
                realTimeFactor >= 1 ? 'ok' : null);
        } catch (error) {
            write(`  ${backend.padEnd(8)} failed: ${error.message}`, 'bad');
        }
    }
    write('');
    write(`A 4-minute recording needs 240 s of audio processed; divide by the real-time factor `
        + `above for the wall-clock analysis time.`, 'muted');
});
</script>
</body>
</html>
