<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Choir Pitch Monitor">
  <rect width="512" height="512" rx="96" fill="#212529"/>
  <!-- Equal-tempered reference lines -->
  <g stroke="#495057" stroke-width="8" stroke-linecap="round">
    <line x1="72" y1="160" x2="440" y2="160"/>
    <line x1="72" y1="256" x2="440" y2="256"/>
    <line x1="72" y1="352" x2="440" y2="352"/>
  </g>
  <!-- A pitch contour sagging below its line, which is what the app is for -->
  <path d="M72 256 C 160 256, 200 258, 248 272 S 360 320, 440 330"
        fill="none" stroke="#4dabf7" stroke-width="20" stroke-linecap="round"/>
  <!-- In-tune band around the centre line -->
  <rect x="72" y="240" width="368" height="32" fill="#51cf66" opacity="0.18"/>
</svg>
